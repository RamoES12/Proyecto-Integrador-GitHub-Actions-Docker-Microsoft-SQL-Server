name: 02 - Reporte programado de ventas CSV

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  reporte:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar SQL Server y cargar datos
        run: bash scripts/setup_db.sh

      - name: Generar reporte CSV
        run: |
          set -euo pipefail
          mkdir -p reportes
          printf '"VentaID","Producto","Cantidad","Fecha"\n' > reportes/reporte_ventas.csv

          docker exec -u 0 \
            -e "SQLCMDPASSWORD=$MSSQL_SA_PASSWORD" \
            empresa-sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -C -b -d EmpresaDB \
            -h -1 -W -w 65535 -i /tmp/sql/report.sql \
            | grep -v "Changed database context" \
            | sed '/^[[:space:]]*$/d' \
            >> reportes/reporte_ventas.csv

          cat reportes/reporte_ventas.csv
          test "$(wc -l < reportes/reporte_ventas.csv)" -eq 6

      - name: Subir reporte como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reporte-ventas-csv
          path: reportes/reporte_ventas.csv
          if-no-files-found: error
          retention-days: 30
