name: 02 - Reporte programado de ventas CSV

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1' # Ejecución semanal programada: Todos los lunes a las 12:00 UTC

permissions:
  contents: read

jobs:
  generar_reporte:
    name: Generación y Publicación de Reporte CSV
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Iniciar Docker y cargar datos de negocio
        run: bash scripts/setup_db.sh

      - name: Exportar reporte de ventas a formato CSV
        run: |
          set -euo pipefail
          mkdir -p reportes
          printf '"VentaID","Producto","Cantidad","Fecha"\n' > reportes/reporte_ventas.csv

          docker exec -i \
            -e "SQLCMDPASSWORD=$MSSQL_SA_PASSWORD" \
            empresa-sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -C -b -d EmpresaDB \
            -h -1 -W -w 65535 -i /dev/stdin \
            < sql/report.sql \
            | grep -v "Changed database context" \
            | sed '/^[[:space:]]*$/d' \
            >> reportes/reporte_ventas.csv

          echo "==> Vista previa del reporte CSV generado:"
          cat reportes/reporte_ventas.csv
          
          # Validación: 1 fila de encabezado + 5 filas de ventas = 6 líneas totales
          lineas=$(wc -l < reportes/reporte_ventas.csv)
          echo "Total de líneas en el reporte: $lineas"
          test "$lineas" -eq 6

      - name: Publicar reporte CSV como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reporte-ventas-csv
          path: reportes/reporte_ventas.csv
          if-no-files-found: error
          retention-days: 30
