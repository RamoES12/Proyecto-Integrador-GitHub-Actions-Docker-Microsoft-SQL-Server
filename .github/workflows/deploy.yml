name: 01 - Desplegar y probar SQL Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar SQL Server y crear tablas
        run: bash scripts/setup_db.sh

      - name: Probar ventas, auditoria e inventario
        run: |
          docker exec -u 0 \
            -e "SQLCMDPASSWORD=$MSSQL_SA_PASSWORD" \
            empresa-sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -C -b -d EmpresaDB -i /tmp/sql/verify.sql
